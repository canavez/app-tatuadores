<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ravenn</title>
    <style>
      html, body { height: 100%; margin: 0; background: #0b0b12; color: #eeeef7;
        font-family: -apple-system, system-ui, sans-serif; }
      main { height: 100%; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 12px; padding: 24px; text-align: center; box-sizing: border-box; }
      p { color: #8e8ea8; margin: 0; }
      button { margin-top: 12px; border: 0; border-radius: 12px; padding: 12px 20px;
        background: #7f79b9; color: #fff; font-size: 16px; font-weight: 600; }
    </style>
  </head>
  <body>
    <!-- Aparece só quando o Ravenn não consegue abrir (sem internet). -->
    <main>
      <h1>Sem conexão</h1>
      <p>O Ravenn precisa de internet para abrir sua agenda.</p>
      <button onclick="location.href='https://ravenn.me'">Tentar de novo</button>
    </main>
  </body>
</html>
